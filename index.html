<!doctype html>
<html lang="es" class="scroll-smooth overflow-x-hidden">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/LogoCHLActualizado.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Carlos Hoyo</title>

    <!-- La fuente del nombre: propia y en el primer viaje, sin depender de Google. -->
    <link rel="preload" href="/fonts/rubik-mono-one-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Adelanta DNS + TLS con Google Fonts mientras se descarga el resto. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Montserrat:ital,wght@0,400..700;1,400..700&family=Quicksand:wght@300..700&display=swap"
    />
    <!--
      Sincroniza el tema antes del primer pintado para evitar el flash blanco.
      Debe ser bloqueante: sin defer, sin async, sin type="module".
      Duplica a propósito la regla de src/theme.ts; si cambias una, cambia la otra.
    -->
    <script>
      (function () {
        var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var stored = null;
        try {
          var value = localStorage.getItem('theme');
          if (value === 'dark' || value === 'light') stored = value;
        } catch (e) { /* localStorage puede lanzar en modo incógnito */ }

        var isMobile = window.matchMedia('(max-width: 767px)').matches;
        var theme = isMobile ? system : (stored || system);

        document.documentElement.classList.toggle('dark', theme === 'dark');
      })();
    </script>
  </head>
  <body class="bg-[#fffffa] font-inter text-[#363636] dark:text-[#e5e5e5] antialiased overflow-x-hidden dark:bg-[#1A1A1A]
              dark:text-dark-text transition-colors duration-500  md:px-0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
